[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civitas-sim"
version = "0.2.0.dev0"
description = "CIVITAS: reproducible local artificial society laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
civitas = "civitas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
